<svg viewBox="0 0 1360 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>StudyBud AI collaborative platform illustration</title>
<desc>A chat panel with an LLaMA-powered study assistant beside a Node.js and MongoDB backend deployed in Docker containers on AWS ECS, in deep blue.</desc>
<defs>
<linearGradient id="bgGradS" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#050f1a"/>
  <stop offset="100%" stop-color="#0a1e35"/>
</linearGradient>
<linearGradient id="cardGradS" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0f2748"/>
  <stop offset="100%" stop-color="#0b1c34"/>
</linearGradient>
<marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5a2444" stroke-width="1.5"/>
</marker>
</defs>

<rect x="0" y="0" width="1360" height="400" fill="url(#bgGradS)"/>
<circle cx="1220" cy="60" r="200" fill="#2860a8" opacity="0.1"/>
<circle cx="90" cy="350" r="150" fill="#20b8a8" opacity="0.06"/>
<g stroke="#1c3a5a" stroke-width="1" opacity="0.4">
  <line x1="0" y1="100" x2="1360" y2="100"/>
  <line x1="0" y1="300" x2="1360" y2="300"/>
</g>

<g transform="translate(40,40)">
  <rect x="0" y="0" width="380" height="320" rx="14" fill="url(#cardGradS)" stroke="#2a5080" stroke-width="1.5"/>
  <circle cx="28" cy="30" r="5" fill="#e4574f"/>
  <circle cx="46" cy="30" r="5" fill="#e4c870"/>
  <circle cx="64" cy="30" r="5" fill="#20b8a8"/>
  <text x="28" y="66" font-family="Georgia, serif" font-size="17" fill="#e8e0d0">StudyBud assistant</text>

  <rect x="28" y="86" width="200" height="42" rx="12" fill="#132a48"/>
  <text x="42" y="112" font-family="Arial" font-size="11.5" fill="#c8d8ec">Explain gradient descent?</text>

  <rect x="106" y="136" width="248" height="72" rx="12" fill="#2860a8" opacity="0.35"/>
  <text x="120" y="158" font-family="Arial" font-size="11.5" fill="#e8e0d0">Iteratively nudges weights</text>
  <text x="120" y="174" font-family="Arial" font-size="11.5" fill="#e8e0d0">toward lower loss, step by step.</text>
  <text x="120" y="196" font-family="Arial" font-size="10" fill="#8ab0d8">GROQ · LLaMA · streamed</text>

  <rect x="28" y="220" width="330" height="34" rx="17" fill="#0b1c34" stroke="#2a5080" stroke-width="1"/>
  <text x="44" y="242" font-family="Arial" font-size="11" fill="#7890a8">Ask StudyBud anything…</text>
  <circle cx="340" cy="237" r="12" fill="#20b8a8" opacity="0.3"/>
  <path d="M336 237 l5 -4 v8 z" fill="#20b8a8"/>

  <rect x="28" y="270" width="330" height="34" rx="8" fill="#132a48"/>
  <path d="M44 285 h10 M49 280 v10" stroke="#c8a84a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="66" y="291" font-family="Arial" font-size="11" fill="#e8e0d0">JWT session · role-based access</text>
</g>

<g transform="translate(450,40)">
  <rect x="0" y="0" width="420" height="150" rx="14" fill="url(#cardGradS)" stroke="#2a5080" stroke-width="1.5"/>
  <text x="24" y="26" font-family="Arial" font-size="12" fill="#8ab0d8">Containerized services</text>
  <g transform="translate(24,40)">
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#132a48" stroke="#2860a8" stroke-width="1"/>
    <text x="56" y="30" font-family="Arial" font-size="11.5" fill="#e8e0d0" text-anchor="middle">Node.js</text>
    <text x="56" y="47" font-family="Arial" font-size="10" fill="#8ab0d8" text-anchor="middle">Express API</text>
    <circle cx="56" cy="60" r="3.6" fill="#20b8a8"/>

    <rect x="136" y="0" width="112" height="76" rx="10" fill="#132a48" stroke="#2860a8" stroke-width="1"/>
    <text x="192" y="30" font-family="Arial" font-size="11.5" fill="#e8e0d0" text-anchor="middle">MongoDB</text>
    <text x="192" y="47" font-family="Arial" font-size="10" fill="#8ab0d8" text-anchor="middle">users · sessions</text>
    <circle cx="192" cy="60" r="3.6" fill="#20b8a8"/>

    <rect x="272" y="0" width="120" height="76" rx="10" fill="#132a48" stroke="#2860a8" stroke-width="1"/>
    <text x="332" y="30" font-family="Arial" font-size="11.5" fill="#e8e0d0" text-anchor="middle">Docker</text>
    <text x="332" y="47" font-family="Arial" font-size="10" fill="#8ab0d8" text-anchor="middle">image build</text>
    <circle cx="332" cy="60" r="3.6" fill="#20b8a8"/>

    <line x1="112" y1="38" x2="136" y2="38" stroke="#3a6098" stroke-width="1.5" marker-end="url(#arrS)"/>
    <line x1="248" y1="38" x2="272" y2="38" stroke="#3a6098" stroke-width="1.5" marker-end="url(#arrS)"/>
  </g>
  <rect x="24" y="126" width="372" height="10" rx="5" fill="#0b1c34" opacity="0.001"/>
  <text x="24" y="132" font-family="Arial" font-size="11" fill="#c8a84a">Deployed on AWS ECS Fargate — serverless scale</text>
</g>

<g transform="translate(450,206)">
  <rect x="0" y="0" width="420" height="154" rx="14" fill="url(#cardGradS)" stroke="#2a5080" stroke-width="1.5"/>
  <text x="24" y="28" font-family="Arial" font-size="12" fill="#8ab0d8">Study room activity</text>
  <g transform="translate(24,42)">
    <circle cx="16" cy="16" r="14" fill="#2860a8" opacity="0.4"/>
    <text x="16" y="20" font-family="Arial" font-size="10" fill="#e8e0d0" text-anchor="middle">JS</text>
    <circle cx="46" cy="16" r="14" fill="#20b8a8" opacity="0.4"/>
    <text x="46" y="20" font-family="Arial" font-size="10" fill="#e8e0d0" text-anchor="middle">MK</text>
    <circle cx="76" cy="16" r="14" fill="#c8a84a" opacity="0.4"/>
    <text x="76" y="20" font-family="Arial" font-size="10" fill="#e8e0d0" text-anchor="middle">RT</text>
    <text x="104" y="20" font-family="Arial" font-size="11" fill="#8ab0d8">+ 12 online</text>
  </g>
  <g transform="translate(24,74)">
    <rect x="0" y="0" width="372" height="34" rx="7" fill="#132a48"/>
    <path d="M12 12 h16 M12 17 h16 M12 22 h9" stroke="#20b8a8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="38" y="21" font-family="Arial" font-size="11" fill="#e8e0d0">Algorithms · Data Structures</text>
    <rect x="0" y="40" width="372" height="34" rx="7" fill="#132a48"/>
    <path d="M12 52 h16 M12 57 h16 M12 62 h9" stroke="#e4574f" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <text x="38" y="61" font-family="Arial" font-size="11" fill="#e8e0d0">ML Project — due Friday</text>
  </g>
</g>

<g transform="translate(910,40)">
  <rect x="0" y="0" width="410" height="320" rx="14" fill="url(#cardGradS)" stroke="#2a5080" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Arial" font-size="12" fill="#8ab0d8">Auth &amp; access control</text>
  <rect x="24" y="48" width="362" height="66" rx="10" fill="#132a48"/>
  <rect x="42" y="66" width="22" height="30" rx="4" fill="none" stroke="#c8a84a" stroke-width="2"/>
  <path d="M47 66 v-8 a8 8 0 0 1 16 0 v8" fill="none" stroke="#c8a84a" stroke-width="2"/>
  <text x="80" y="82" font-family="Arial" font-size="11.5" fill="#e8e0d0">JWT · role-based access</text>
  <text x="80" y="100" font-family="Arial" font-size="10" fill="#8ab0d8">middleware validated on every request</text>

  <text x="24" y="150" font-family="Arial" font-size="12" fill="#8ab0d8">MongoDB schema</text>
  <g font-family="Arial" font-size="11" fill="#e8e0d0">
    <text x="24" y="176">users</text>
    <text x="24" y="200">sessions</text>
    <text x="24" y="224">tasks</text>
  </g>
  <line x1="90" y1="170" x2="360" y2="170" stroke="#2a5080" stroke-width="0.6"/>
  <line x1="90" y1="194" x2="360" y2="194" stroke="#2a5080" stroke-width="0.6"/>
  <line x1="90" y1="218" x2="360" y2="218" stroke="#2a5080" stroke-width="0.6"/>

  <line x1="24" y1="248" x2="386" y2="248" stroke="#2a5080" stroke-width="1"/>
  <text x="24" y="276" font-family="Arial" font-size="12" fill="#e8e0d0">Cloud-native, containerized,</text>
  <text x="24" y="296" font-family="Arial" font-size="12" fill="#e8e0d0">serverless-scale collaboration.</text>
</g>
</svg>
