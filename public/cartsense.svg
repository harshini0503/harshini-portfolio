<svg viewBox="0 0 1360 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CartSense smart household inventory dashboard illustration</title>
<desc>A dashboard showing a shared shopping list, low-stock alert, checkout-to-inventory sync, and a live analytics chart, in teal and gold.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#051a18"/>
  <stop offset="100%" stop-color="#0a352e"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0f2a26"/>
  <stop offset="100%" stop-color="#0b201c"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1360" height="400" fill="url(#bgGrad)"/>
<circle cx="1220" cy="60" r="200" fill="#20b8a8" opacity="0.07"/>
<circle cx="90" cy="360" r="150" fill="#c8a84a" opacity="0.06"/>
<g stroke="#1c3f3a" stroke-width="1" opacity="0.4">
  <line x1="0" y1="100" x2="1360" y2="100"/>
  <line x1="0" y1="300" x2="1360" y2="300"/>
</g>

<g transform="translate(40,40)">
  <rect x="0" y="0" width="380" height="320" rx="14" fill="url(#cardGrad)" stroke="#2a4f48" stroke-width="1.5"/>
  <circle cx="30" cy="32" r="5" fill="#e4574f"/>
  <circle cx="48" cy="32" r="5" fill="#e4c870"/>
  <circle cx="66" cy="32" r="5" fill="#20b8a8"/>
  <text x="30" y="72" font-family="Georgia, serif" font-size="19" fill="#e8e0d0">CartSense</text>
  <text x="30" y="94" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Household Inventory</text>

  <rect x="30" y="114" width="320" height="58" rx="9" fill="#132e29"/>
  <rect x="44" y="130" width="24" height="24" rx="6" fill="#20b8a8" opacity="0.28"/>
  <path d="M51 142 h10 M56 137 v10" stroke="#20b8a8" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="146" font-family="Arial, sans-serif" font-size="12.5" fill="#e8e0d0">Milk, eggs, bread</text>
  <text x="82" y="162" font-family="Arial, sans-serif" font-size="10.5" fill="#a8a090">Shared list · synced live</text>

  <rect x="30" y="182" width="320" height="58" rx="9" fill="#2a1f12"/>
  <rect x="44" y="198" width="24" height="24" rx="6" fill="#c86030" opacity="0.32"/>
  <path d="M56 202 v9 M56 214 v0.3" stroke="#e4914a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="82" y="214" font-family="Arial, sans-serif" font-size="12.5" fill="#e8e0d0">Low stock: rice, coffee</text>
  <text x="82" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#c89a70">Auto-alert triggered</text>

  <rect x="30" y="256" width="140" height="30" rx="15" fill="none" stroke="#2a4f48" stroke-width="1.2"/>
  <rect x="40" y="264" width="12" height="14" rx="3" fill="none" stroke="#e4c870" stroke-width="1.5"/>
  <path d="M43 264 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#e4c870" stroke-width="1.5"/>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="11" fill="#e4c870">JWT secured</text>
</g>

<g transform="translate(450,40)">
  <rect x="0" y="0" width="430" height="150" rx="14" fill="url(#cardGrad)" stroke="#2a4f48" stroke-width="1.5"/>
  <rect x="22" y="22" width="66" height="66" rx="10" fill="#20b8a8" opacity="0.18"/>
  <path d="M42 42 h13 l6 29 h29 l8 -20 h-35" fill="none" stroke="#20b8a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="83" r="3.6" fill="#20b8a8"/>
  <circle cx="80" cy="83" r="3.6" fill="#20b8a8"/>
  <text x="106" y="48" font-family="Arial, sans-serif" font-size="15.5" fill="#e8e0d0">Checkout → inventory</text>
  <text x="106" y="70" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Receipt scan auto-updates stock</text>
  <text x="106" y="88" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">levels the moment you shop</text>

  <line x1="22" y1="112" x2="408" y2="112" stroke="#2a4f48" stroke-width="1"/>
  <text x="22" y="136" font-family="Arial, sans-serif" font-size="11.5" fill="#a8a090">React · TypeScript · Vite</text>
  <text x="230" y="136" font-family="Arial, sans-serif" font-size="11.5" fill="#a8a090">Flask · SQLAlchemy · SQLite</text>
</g>

<g transform="translate(450,206)">
  <rect x="0" y="0" width="430" height="154" rx="14" fill="url(#cardGrad)" stroke="#2a4f48" stroke-width="1.5"/>
  <text x="22" y="28" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Real-time analytics</text>
  <g transform="translate(22,42)">
    <polyline points="0,72 42,54 84,60 126,33 168,42 210,12 252,24 294,6 336,18 378,2"
      fill="none" stroke="#20b8a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,72 42,54 84,60 126,33 168,42 210,12 252,24 294,6 336,18 378,2 378,90 0,90"
      fill="#20b8a8" opacity="0.12" stroke="none"/>
    <circle cx="294" cy="6" r="4" fill="#e4c870"/>
  </g>
  <rect x="22" y="118" width="150" height="24" rx="7" fill="#132e29"/>
  <text x="34" y="134" font-family="Arial, sans-serif" font-size="10.5" fill="#20b8a8">Recharts live sync</text>
</g>

<g transform="translate(910,40)">
  <rect x="0" y="0" width="410" height="320" rx="14" fill="url(#cardGrad)" stroke="#2a4f48" stroke-width="1.5"/>
  <text x="22" y="30" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Monthly spend</text>
  <g transform="translate(22,44)">
    <rect x="0"  y="66" width="30" height="26" rx="4" fill="#20b8a8" opacity="0.35"/>
    <rect x="42" y="44" width="30" height="48" rx="4" fill="#20b8a8" opacity="0.55"/>
    <rect x="84" y="24" width="30" height="68" rx="4" fill="#c8a84a" opacity="0.85"/>
    <rect x="126" y="52" width="30" height="40" rx="4" fill="#20b8a8" opacity="0.45"/>
    <rect x="168" y="10" width="30" height="82" rx="4" fill="#e4c870"/>
    <rect x="210" y="36" width="30" height="56" rx="4" fill="#20b8a8" opacity="0.55"/>
    <rect x="252" y="58" width="30" height="34" rx="4" fill="#20b8a8" opacity="0.35"/>
    <rect x="294" y="18" width="30" height="74" rx="4" fill="#c8a84a" opacity="0.6"/>
    <rect x="336" y="46" width="30" height="46" rx="4" fill="#20b8a8" opacity="0.5"/>
    <line x1="0" y1="92" x2="366" y2="92" stroke="#2a4f48" stroke-width="1"/>
  </g>
  <line x1="22" y1="170" x2="388" y2="170" stroke="#2a4f48" stroke-width="1"/>
  <text x="22" y="196" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Low-stock alerts</text>
  <text x="22" y="220" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Receipt-based sync</text>
  <text x="22" y="244" font-family="Arial, sans-serif" font-size="12" fill="#a8a090">Shared household lists</text>
  <circle cx="370" cy="192" r="5" fill="#20b8a8"/>
  <circle cx="370" cy="216" r="5" fill="#20b8a8"/>
  <circle cx="370" cy="240" r="5" fill="#20b8a8"/>
</g>
</svg>
