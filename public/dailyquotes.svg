<svg viewBox="0 0 1360 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DailyQuotes native iOS app illustration</title>
<desc>An iPhone mockup showing a quote card with a swipe-to-favorite gesture, an MVC architecture diagram, and CoreData persistence, in magenta and gold.</desc>
<defs>
<linearGradient id="bgGradD" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1a0510"/>
  <stop offset="100%" stop-color="#300a20"/>
</linearGradient>
<linearGradient id="cardGradD" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#3a0f28"/>
  <stop offset="100%" stop-color="#280a1c"/>
</linearGradient>
<marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5a2444" stroke-width="1.5"/>
</marker>
</defs>

<rect x="0" y="0" width="1360" height="400" fill="url(#bgGradD)"/>
<circle cx="1220" cy="60" r="200" fill="#e05a9a" opacity="0.07"/>
<circle cx="90" cy="350" r="150" fill="#c8a84a" opacity="0.06"/>
<g stroke="#4a1a38" stroke-width="1" opacity="0.4">
  <line x1="0" y1="100" x2="1360" y2="100"/>
  <line x1="0" y1="300" x2="1360" y2="300"/>
</g>

<g transform="translate(60,32)">
  <rect x="0" y="0" width="230" height="336" rx="28" fill="#1a0512" stroke="#5a2444" stroke-width="3"/>
  <rect x="12" y="24" width="206" height="288" rx="5" fill="url(#cardGradD)"/>
  <rect x="90" y="10" width="50" height="9" rx="4.5" fill="#1a0512"/>

  <text x="115" y="58" font-family="Arial" font-size="10" fill="#c090a8" text-anchor="middle">TODAY</text>
  <rect x="28" y="72" width="174" height="138" rx="12" fill="#4a1a38" opacity="0.6"/>
  <text x="115" y="112" font-family="Georgia, serif" font-size="12.5" fill="#e8e0d0" text-anchor="middle">"Small steps,</text>
  <text x="115" y="132" font-family="Georgia, serif" font-size="12.5" fill="#e8e0d0" text-anchor="middle">every single day."</text>
  <path d="M98 152 l8 -12 l8 12 l8 -17 l8 17 l8 -10" fill="none" stroke="#e05a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="178" cy="96" r="11" fill="#e4574f" opacity="0.85"/>
  <path d="M178 91 c-3 -3 -8 -1 -8 3 c0 4 8 9 8 9 s8 -5 8 -9 c0 -4 -5 -6 -8 -3z" fill="#fff" opacity="0.9"/>

  <g transform="translate(28,222)">
    <rect x="0" y="0" width="174" height="40" rx="8" fill="#3a0f28"/>
    <circle cx="18" cy="20" r="3.4" fill="#20b8a8"/>
    <text x="32" y="24" font-family="Arial" font-size="9.5" fill="#e8e0d0">"Discipline equals freedom."</text>
    <rect x="0" y="48" width="174" height="40" rx="8" fill="#3a0f28"/>
    <circle cx="18" cy="68" r="3.4" fill="#c8a84a"/>
    <text x="32" y="72" font-family="Arial" font-size="9.5" fill="#e8e0d0">"Progress, not perfection."</text>
  </g>

  <rect x="12" y="288" width="206" height="24" fill="#1a0512"/>
  <circle cx="70" cy="300" r="10" fill="none" stroke="#c090a8" stroke-width="1.4"/>
  <circle cx="115" cy="300" r="10" fill="none" stroke="#e05a9a" stroke-width="1.4"/>
  <path d="M111 300 l3 3 l6 -7" fill="none" stroke="#e05a9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="300" r="10" fill="none" stroke="#c090a8" stroke-width="1.4"/>
</g>

<g transform="translate(360,40)">
  <rect x="0" y="0" width="470" height="150" rx="14" fill="url(#cardGradD)" stroke="#5a2444" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Arial" font-size="12" fill="#c090a8">Architecture</text>
  <g transform="translate(24,50)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#3a0f28" stroke="#5a2444" stroke-width="1"/>
    <text x="65" y="36" font-family="Arial" font-size="12.5" fill="#e8e0d0" text-anchor="middle">Model</text>
    <rect x="160" y="0" width="130" height="60" rx="8" fill="#3a0f28" stroke="#5a2444" stroke-width="1"/>
    <text x="225" y="36" font-family="Arial" font-size="12.5" fill="#e8e0d0" text-anchor="middle">View</text>
    <rect x="320" y="0" width="130" height="60" rx="8" fill="#3a0f28" stroke="#5a2444" stroke-width="1"/>
    <text x="385" y="36" font-family="Arial" font-size="12.5" fill="#e8e0d0" text-anchor="middle">Controller</text>
    <line x1="130" y1="30" x2="160" y2="30" stroke="#5a2444" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="290" y1="30" x2="320" y2="30" stroke="#5a2444" stroke-width="1.5" marker-end="url(#arrD)"/>
  </g>
  <text x="24" y="136" font-family="Arial" font-size="11" fill="#a090a8">Clean separation of concerns, reusable cells</text>
</g>

<g transform="translate(360,206)">
  <rect x="0" y="0" width="470" height="154" rx="14" fill="url(#cardGradD)" stroke="#5a2444" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Arial" font-size="12" fill="#c090a8">Persistence</text>
  <rect x="24" y="48" width="205" height="80" rx="10" fill="#3a0f28"/>
  <path d="M50 84 a13 13 0 1 1 0.01 0" fill="none" stroke="#20b8a8" stroke-width="2.2"/>
  <text x="76" y="88" font-family="Arial" font-size="12.5" fill="#e8e0d0">CoreData store</text>
  <text x="76" y="106" font-family="Arial" font-size="10.5" fill="#c090a8">favorites persisted locally</text>

  <rect x="245" y="48" width="205" height="80" rx="10" fill="#3a0f28"/>
  <rect x="266" y="70" width="20" height="20" rx="4" fill="none" stroke="#c8a84a" stroke-width="2"/>
  <text x="298" y="86" font-family="Arial" font-size="12.5" fill="#e8e0d0">UserDefaults</text>
  <text x="298" y="104" font-family="Arial" font-size="10.5" fill="#c090a8">theme &amp; preferences</text>
</g>

<g transform="translate(860,40)">
  <rect x="0" y="0" width="460" height="320" rx="14" fill="url(#cardGradD)" stroke="#5a2444" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Arial" font-size="12" fill="#c090a8">UITableView rendering</text>
  <g transform="translate(24,48)">
    <rect x="0" y="0" width="412" height="46" rx="8" fill="#3a0f28"/>
    <text x="16" y="29" font-family="Arial" font-size="11.5" fill="#e8e0d0">Cell reuse identifier · quoteCell</text>
    <rect x="0" y="54" width="412" height="46" rx="8" fill="#3a0f28"/>
    <text x="16" y="83" font-family="Arial" font-size="11.5" fill="#e8e0d0">Lazy image + text loading</text>
    <rect x="0" y="108" width="412" height="46" rx="8" fill="#3a0f28"/>
    <text x="16" y="137" font-family="Arial" font-size="11.5" fill="#e8e0d0">Swipe-to-favorite gesture</text>
  </g>
  <line x1="24" y1="228" x2="436" y2="228" stroke="#5a2444" stroke-width="1"/>
  <text x="24" y="254" font-family="Arial" font-size="13" fill="#e4c870">Smooth 60fps scroll</text>
  <text x="24" y="278" font-family="Arial" font-size="11" fill="#c090a8">Swift · UIKit · Xcode · TestFlight</text>
</g>
</svg>
