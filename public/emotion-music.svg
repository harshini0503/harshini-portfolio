    <rect x="0" y="55" width="16" height="80" fill="#8a5cf0"/>
    <rect x="24" y="27" width="16" height="108" fill="#c8a84a"/>
    <rect x="48" y="72" width="16" height="63" fill="#8a5cf0" opacity="0.7"/>
    <rect x="72" y="9" width="16" height="126" fill="#e4c870"/>
    <rect x="96" y="45" width="16" height="90" fill="#8a5cf0" opacity="0.6"/>
    <rect x="120" y="63" width="16" height="72" fill="#8a5cf0" opacity="0.8"/>
    <rect x="144" y="18" width="16" height="117" fill="#c8a84a" opacity="0.8"/>
    <rect x="168" y="81" width="16" height="54" fill="#8a5cf0" opacity="0.5"/>
    <rect x="192" y="36" width="16" height="99" fill="#8a5cf0"/>
    <rect x="216" y="59" width="16" height="76" fill="#e4c870" opacity="0.7"/>
    <rect x="240" y="13" width="16" height="122" fill="#8a5cf0" opacity="0.6"/>
    <rect x="264" y="50" width="16" height="85" fill="#c8a84a"/>
    <rect x="288" y="32" width="16" height="103" fill="#8a5cf0" opacity="0.7"/>
    <rect x="312" y="68" width="16" height="67" fill="#8a5cf0"/>
    <rect x="336" y="23" width="16" height="112" fill="#e4c870" opacity="0.8"/>
    <rect x="360" y="54" width="16" height="81" fill="#8a5cf0" opacity="0.6"/>
    <rect x="384" y="41" width="16" height="94" fill="#c8a84a" opacity="0.7"/>
    <line x1="0" y1="135" x2="400" y2="135" stroke="#4a3480" stroke-width="1"/>
  </g>
  <rect x="24" y="188" width="150" height="24" rx="12" fill="#20b8a8" opacity="0.18"/>
  <text x="36" y="204" font-family="Arial" font-size="10.5" fill="#20b8a8">Spotify API · live sync</text>
</g>

<g transform="translate(400,206)">
  <rect x="0" y="0" width="470" height="154" rx="14" fill="url(#cardGradM)" stroke="#4a3480" stroke-width="1.5"/>
  <text x="24" y="28" font-family="Arial" font-size="12" fill="#b0a0d8">Per-class confidence</text>
  <g font-family="Arial" font-size="11.5" fill="#e8e0d0">
    <text x="24" y="56">Happy</text>
    <rect x="100" y="46" width="340" height="10" rx="5" fill="#2a1f50"/>
    <rect x="100" y="46" width="300" height="10" rx="5" fill="#8a5cf0"/>
    <text x="24" y="84">Calm</text>
    <rect x="100" y="74" width="340" height="10" rx="5" fill="#2a1f50"/>
    <rect x="100" y="74" width="150" height="10" rx="5" fill="#c8a84a"/>
    <text x="24" y="112">Energetic</text>
    <rect x="100" y="102" width="340" height="10" rx="5" fill="#2a1f50"/>
    <rect x="100" y="102" width="90" height="10" rx="5" fill="#20b8a8"/>
  </g>
  <rect x="24" y="122" width="200" height="24" rx="12" fill="none" stroke="#4a3480" stroke-width="1.2"/>
  <text x="36" y="138" font-family="Arial" font-size="10.5" fill="#c8a84a">Streamlit live dashboard</text>
</g>

<g transform="translate(910,40)">
  <rect x="0" y="0" width="410" height="320" rx="14" fill="url(#cardGradM)" stroke="#4a3480" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Arial" font-size="12" fill="#b0a0d8">Two-tower embedding match</text>
  <circle cx="90" cy="110" r="30" fill="none" stroke="#8a5cf0" stroke-width="2.2"/>
  <text x="90" y="116" font-family="Arial" font-size="11" fill="#e8e0d0" text-anchor="middle">face</text>
  <circle cx="230" cy="110" r="30" fill="none" stroke="#c8a84a" stroke-width="2.2"/>
  <text x="230" y="116" font-family="Arial" font-size="11" fill="#e8e0d0" text-anchor="middle">song</text>
  <line x1="122" y1="110" x2="198" y2="110" stroke="#e4c870" stroke-width="1.6" stroke-dasharray="4,4"/>
  <text x="160" y="98" font-family="Arial" font-size="10" fill="#e4c870" text-anchor="middle">cosine sim</text>

  <line x1="24" y1="164" x2="386" y2="164" stroke="#4a3480" stroke-width="1"/>
  <text x="24" y="192" font-family="Arial" font-size="12" fill="#a090c8">Swappable backbone</text>
  <text x="24" y="216" font-family="Arial" font-size="12" fill="#a090c8">Feedback-driven ranking</text>
  <text x="24" y="240" font-family="Arial" font-size="12" fill="#a090c8">Docker-packaged inference</text>
  <circle cx="380" cy="188" r="4.5" fill="#8a5cf0"/>
  <circle cx="380" cy="212" r="4.5" fill="#8a5cf0"/>
  <circle cx="380" cy="236" r="4.5" fill="#8a5cf0"/>
</g>
</svg>
