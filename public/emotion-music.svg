<svg viewBox="0 0 1360 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Emotion-based music recommender illustration</title>
<desc>Webcam facial emotion detection feeding a PyTorch model that generates a Spotify-style playlist waveform, in purple and gold.</desc>
<defs>
<linearGradient id="bgGradM" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0d0820"/>
  <stop offset="100%" stop-color="#1a0d35"/>
</linearGradient>
<linearGradient id="cardGradM" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#231250"/>
  <stop offset="100%" stop-color="#160b34"/>
</linearGradient>
<marker id="arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#6a4ab0" stroke-width="1.5"/>
</marker>
</defs>

<rect x="0" y="0" width="1360" height="400" fill="url(#bgGradM)"/>
<circle cx="1220" cy="60" r="200" fill="#8a5cf0" opacity="0.08"/>
<circle cx="90" cy="350" r="150" fill="#e4c870" opacity="0.06"/>
<g stroke="#3a2a70" stroke-width="1" opacity="0.4">
  <line x1="0" y1="100" x2="1360" y2="100"/>
  <line x1="0" y1="300" x2="1360" y2="300"/>
</g>

<g transform="translate(40,40)">
  <rect x="0" y="0" width="330" height="320" rx="14" fill="url(#cardGradM)" stroke="#4a3480" stroke-width="1.5"/>
  <text x="26" y="32" font-family="Georgia, serif" font-size="16" fill="#e8e0d0">Webcam feed</text>

  <rect x="26" y="50" width="278" height="176" rx="10" fill="#0f0826"/>
  <circle cx="165" cy="122" r="54" fill="none" stroke="#8a5cf0" stroke-width="2.2"/>
  <circle cx="146" cy="110" r="5" fill="#c8a84a"/>
  <circle cx="184" cy="110" r="5" fill="#c8a84a"/>
  <path d="M140 142 q25 20 50 0" fill="none" stroke="#c8a84a" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="120" y="192" width="90" height="22" rx="11" fill="#8a5cf0" opacity="0.25"/>
  <text x="165" y="207" font-family="Arial" font-size="11.5" fill="#e4d8ff" text-anchor="middle">Happy · 92%</text>

  <text x="26" y="250" font-family="Arial" font-size="11.5" fill="#b0a0d8">PyTorch · EfficientNet</text>
  <g transform="translate(26,262)">
    <rect x="0" y="0" width="50" height="38" rx="6" fill="#8a5cf0" opacity="0.2" stroke="#8a5cf0" stroke-width="1"/>
    <rect x="66" y="6" width="50" height="26" rx="6" fill="#8a5cf0" opacity="0.3" stroke="#8a5cf0" stroke-width="1"/>
    <rect x="132" y="11" width="50" height="16" rx="6" fill="#c8a84a" opacity="0.4" stroke="#c8a84a" stroke-width="1"/>
    <rect x="198" y="6" width="50" height="26" rx="6" fill="#8a5cf0" opacity="0.3" stroke="#8a5cf0" stroke-width="1"/>
    <line x1="50" y1="19" x2="66" y2="19" stroke="#6a4ab0" stroke-width="1.5" marker-end="url(#arrM)"/>
    <line x1="116" y1="19" x2="132" y2="19" stroke="#6a4ab0" stroke-width="1.5" marker-end="url(#arrM)"/>
    <line x1="182" y1="19" x2="198" y2="19" stroke="#6a4ab0" stroke-width="1.5" marker-end="url(#arrM)"/>
  </g>
</g>

<g transform="translate(400,40)">
  <rect x="0" y="0" width="470" height="150" rx="14" fill="url(#cardGradM)" stroke="#4a3480" stroke-width="1.5"/>
