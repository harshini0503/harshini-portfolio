<svg viewBox="0 0 1360 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Intelligent shopping cart IoT system illustration</title>
<desc>A physical shopping cart fitted with an RFID reader exchanging Zigbee signals with a Raspberry Pi node and an automated billing terminal, in amber and brown.</desc>
<defs>
<linearGradient id="bgGradC" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#151005"/>
  <stop offset="100%" stop-color="#252010"/>
</linearGradient>
<linearGradient id="cardGradC" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#332a12"/>
  <stop offset="100%" stop-color="#22190c"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1360" height="400" fill="url(#bgGradC)"/>
<circle cx="1220" cy="60" r="200" fill="#e4c870" opacity="0.07"/>
<circle cx="90" cy="350" r="150" fill="#20b8a8" opacity="0.05"/>
<g stroke="#3a3018" stroke-width="1" opacity="0.4">
  <line x1="0" y1="100" x2="1360" y2="100"/>
  <line x1="0" y1="300" x2="1360" y2="300"/>
</g>

<g transform="translate(60,110)">
  <path d="M16 0 h34 l16 34 h250" fill="none" stroke="#c8a84a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 34 l34 186 h190 l28 -140 h-216" fill="none" stroke="#c8a84a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#8a7030" stroke-width="2" opacity="0.8">
    <line x1="86" y1="60" x2="102" y2="212"/>
    <line x1="120" y1="60" x2="132" y2="212"/>
    <line x1="154" y1="60" x2="162" y2="212"/>
    <line x1="188" y1="60" x2="192" y2="212"/>
    <line x1="222" y1="60" x2="222" y2="212"/>
    <line x1="256" y1="60" x2="252" y2="212"/>
  </g>
  <circle cx="120" cy="242" r="17" fill="none" stroke="#8a7030" stroke-width="5"/>
  <circle cx="252" cy="242" r="17" fill="none" stroke="#8a7030" stroke-width="5"/>

  <rect x="280" y="26" width="68" height="52" rx="8" fill="#22190c" stroke="#e4c870" stroke-width="2"/>
  <text x="314" y="48" font-family="Arial" font-size="10" fill="#e4c870" text-anchor="middle">RFID</text>
  <text x="314" y="62" font-family="Arial" font-size="10" fill="#e4c870" text-anchor="middle">reader</text>
  <path d="M352 52 q12 -14 0 -28" fill="none" stroke="#e4c870" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M362 52 q19 -22 0 -44" fill="none" stroke="#e4c870" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</g>

<g transform="translate(480,40)">
  <rect x="0" y="0" width="270" height="150" rx="14" fill="url(#cardGradC)" stroke="#5a4a20" stroke-width="1.5"/>
  <text x="22" y="28" font-family="Arial" font-size="12" fill="#d8c090">Raspberry Pi node</text>
  <rect x="22" y="42" width="226" height="90" rx="10" fill="#22190c" stroke="#5a4a20" stroke-width="1"/>
  <circle cx="52" cy="68" r="8" fill="#20b8a8" opacity="0.6"/>
  <circle cx="76" cy="68" r="8" fill="#c8a84a" opacity="0.6"/>
  <circle cx="100" cy="68" r="8" fill="#e4574f" opacity="0.5"/>
  <rect x="40" y="88" width="150" height="8" rx="4" fill="#3a3018"/>
  <rect x="40" y="102" width="110" height="8" rx="4" fill="#3a3018"/>
  <rect x="40" y="116" width="130" height="8" rx="4" fill="#3a3018"/>
</g>

<g transform="translate(480,206)">
  <rect x="0" y="0" width="270" height="154" rx="14" fill="url(#cardGradC)" stroke="#5a4a20" stroke-width="1.5"/>
  <text x="22" y="28" font-family="Arial" font-size="12" fill="#d8c090">Zigbee mesh → cloud</text>
  <circle cx="58" cy="82" r="16" fill="#e4c870" opacity="0.25"/>
  <circle cx="58" cy="82" r="5" fill="#e4c870"/>
  <path d="M80 82 h24" stroke="#e4c870" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="126" cy="82" r="16" fill="#20b8a8" opacity="0.25"/>
  <circle cx="126" cy="82" r="5" fill="#20b8a8"/>
  <path d="M148 82 h24" stroke="#20b8a8" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="178" y="58" width="46" height="48" rx="8" fill="#22190c" stroke="#20b8a8" stroke-width="1.5"/>
  <text x="201" y="86" font-family="Arial" font-size="10" fill="#20b8a8" text-anchor="middle">Wi-Fi</text>
  <text x="22" y="128" font-family="Arial" font-size="11" fill="#a89058">Embedded C · real-time sync</text>
</g>

<g transform="translate(790,40)">
  <rect x="0" y="0" width="530" height="320" rx="14" fill="url(#cardGradC)" stroke="#5a4a20" stroke-width="1.5"/>
  <text x="26" y="30" font-family="Arial" font-size="13" fill="#d8c090">Automated billing</text>
  <g font-family="Arial" font-size="13" fill="#e8e0d0">
    <text x="26" y="70">Milk 1 gal</text>
    <text x="490" y="70" text-anchor="end">$3.49</text>
    <text x="26" y="98">Whole wheat bread</text>
    <text x="490" y="98" text-anchor="end">$2.99</text>
    <text x="26" y="126">Organic eggs (12)</text>
    <text x="490" y="126" text-anchor="end">$4.29</text>
    <text x="26" y="154">Coffee beans 12oz</text>
    <text x="490" y="154" text-anchor="end">$8.99</text>
  </g>
  <line x1="26" y1="172" x2="504" y2="172" stroke="#5a4a20" stroke-width="1"/>
  <text x="26" y="200" font-family="Arial" font-size="14" fill="#e4c870">Total</text>
  <text x="490" y="200" font-family="Arial" font-size="14" fill="#e4c870" text-anchor="end">$19.76</text>

  <rect x="26" y="230" width="220" height="46" rx="23" fill="none" stroke="#5a4a20" stroke-width="1.4"/>
  <path d="M46 253 a10 10 0 1 1 0.01 0" fill="none" stroke="#20b8a8" stroke-width="2"/>
  <text x="70" y="258" font-family="Arial" font-size="12.5" fill="#20b8a8">Tap to pay · contactless</text>
</g>
</svg>
